name: Deploy جيبتك to GitHub Pages

# The test job runs on every push to the working branch.
# The deploy job publishes public/ to GitHub Pages, but ONLY when the
# repo variable DEPLOY_TO_PAGES is set to "true"
# (repo Settings -> Secrets and variables -> Actions -> Variables).
# GitHub Pages needs either a public repo or a GitHub Pro/Team plan for
# a private one; until that is sorted the deploy job is skipped, not failed.
on:
  push:
    branches: [jad/claude-edits]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install jsdom for the UI tests
        run: mkdir -p .qa && cd .qa && npm install --no-package-lock --no-save jsdom@^26.1.0
      - name: Run the local test suite
        run: node --test tests/core.test.cjs tests/pwa.test.cjs tests/ui.test.cjs tests/sync.test.cjs tests/sync-worker.test.cjs

  deploy:
    needs: test
    if: vars.DEPLOY_TO_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
