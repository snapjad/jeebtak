name: Deploy جيبتك to GitHub Pages

# Every push to the working branch runs the tests and, if they pass,
# publishes public/ to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [jad/claude-edits]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install jsdom for the UI tests
        run: mkdir -p .qa && cd .qa && npm install --no-package-lock --no-save jsdom@^26.1.0
      - name: Run the local test suite
        run: node --test tests/core.test.cjs tests/pwa.test.cjs tests/ui.test.cjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
